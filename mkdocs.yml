theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: aa
      accent: aa
  features:
    - navigation.tabs
    - navigation.tracking
    - search.suggest
    - toc.integrate
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mike:
      alias_type: redirect
      redirect_template: null
extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BulletTrade/bullet-trade
extra_css:
  - css/custom.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - js/mermaid-init.js
